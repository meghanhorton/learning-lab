<body data-page="lesson">
  <nav id="appbar" class="appbar" aria-label="App navigation">
    <div class="nav-group" data-nav-slot="links"></div>
    <span class="appbar-title"></span>
    <div class="nav-group" data-nav-slot="reading"></div>
    <div class="nav-group nav-actions" data-nav-slot="actions"></div>
    <div class="nav-group" data-nav-slot="timer"></div>
    <p id="app-notice" class="app-notice" role="status" aria-live="polite"></p>
  </nav>
  <main id="lesson-panel" class="page-content">
    <div class="lesson-heading">
      <div>
        <h1 id="lesson-title"></h1>
        <label for="lesson-title-input" class="form-label edit-only">Lesson title</label>
        <input id="lesson-title-input" class="form-control form-control-lg edit-only" maxlength="200">
        <p id="lesson-progress" class="mt-3" role="status"></p>
      </div>
      <div class="lesson-total-card">
        <span>Total time</span>
        <output id="lesson-total" aria-label="Total elapsed activity time">00:00</output>
      </div>
    </div>
    <p class="lesson-note">Changes save in this browser. Share the current link to transfer the lesson, checkboxes and recorded times to another device. Devices do not live-sync.</p>
    <p id="lesson-message" role="status" aria-live="polite"></p>
    <div id="lesson-sections"></div>
    
    
    <input id="lesson-import-file" type="file" accept="application/json,.json" hidden>
  </main>
  <nav id="lesson-editor-nav" aria-label="Lesson editing and saving"><div class="lesson-editor-inner"><div data-nav-slot="lesson-editor"></div><div class="lesson-editor-static"><button id="lesson-add-section" class="btn btn-outline-primary edit-only" type="button">+ Add section</button><button id="lesson-clear" class="btn btn-outline-secondary" type="button">Clear checkboxes</button></div></div></nav>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/lesson.js"></script>
</body>
</html>
